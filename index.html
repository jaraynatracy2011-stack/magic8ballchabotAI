<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magic 8 Ball</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; color: #f3f6ff; font: 16px Arial, sans-serif;
      background: radial-gradient(ellipse at top, #253d72, #090e1b 65%);
    }
    main { width: min(100%, 520px); text-align: center; }
    h1 { margin-bottom: 8px; }
    .ball {
      width: 260px; height: 260px; margin: 28px auto;
      display: grid; place-items: center; border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #315cc0, #07132f 70%);
      box-shadow: inset -15px -18px 30px #030817, 0 20px 50px #0009;
    }
    .window {
      width: 126px; height: 135px; display: grid; place-items: center;
      padding: 28px 12px 8px; background: #eaf2ff; color: #102143;
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
      font-weight: bold; line-height: 1.2;
    }
    form { display: flex; gap: 8px; }
    input, button {
      border: 0; border-radius: 10px; padding: 14px; font: inherit;
    }
    input { flex: 1; min-width: 0; }
    button { color: white; background: #3279ed; font-weight: bold; cursor: pointer; }
    button:hover { background: #5592ff; }
    #history { margin-top: 20px; text-align: left; }
    #history p { padding: 12px; border-radius: 10px; background: #ffffff12; }
    .shake { animation: shake .55s; }
    @keyframes shake {
      25% { transform: translateX(-10px) rotate(-6deg); }
      50% { transform: translateX(10px) rotate(6deg); }
      75% { transform: translateX(-7px) rotate(-4deg); }
    }
    @media (max-width: 430px) {
      .ball { width: 220px; height: 220px; }
      form { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Magic 8 Ball</h1>
    <p>Ask a yes-or-no question, then shake for an answer.</p>

    <div class="ball" id="ball" aria-live="polite">
      <div class="window" id="answer">Ask away!</div>
    </div>

    <form id="form">
      <input id="question" placeholder="Type your question…" maxlength="150" required>
      <button type="submit">Shake the 8 Ball</button>
    </form>
    <div id="history" aria-live="polite"></div>
  </main>

  <script>
    const answers = [
      "It is certain", "Without a doubt", "Yes!",
      "Signs point to yes", "Most likely", "Ask again later",
      "Reply hazy, try again", "Cannot predict now",
      "Don't count on it", "I said no", "dont ask again"
    ];
    const form = document.getElementById("form");
    const question = document.getElementById("question");
    const ball = document.getElementById("ball");
    const answerBox = document.getElementById("answer");
    const history = document.getElementById("history");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const asked = question.value.trim();
      if (!asked) return;

      answerBox.textContent = "...";
      ball.classList.remove("shake");
      void ball.offsetWidth;
      ball.classList.add("shake");

      setTimeout(() => {
        const answer = answers[Math.floor(Math.random() * answers.length)];
        answerBox.textContent = answer;

        const entry = document.createElement("p");
        entry.textContent = `You asked: ${asked} — ${answer}`;
        history.prepend(entry);
        question.value = "";
      }, 600);
    });
  </script>
</body>
</html>
